<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <div class="container" id="container">
        <div class="theme-toggle" id="theme-toggle">
            <div onclick="circle()" class="circle" id="toggleCircle"></div>

        </div>
        <div class="content">
            <div onclick="minusBtn()" class="arrow"> 
                <i class="fa-solid fa-minus"  style="color: rgb(1, 153, 1);"></i>
            </div>
            <div class="center" id="change-numbers"> 0 </div>
            <div onclick="plusBtn()" class="arrow"> 
                <i class="fa-solid fa-plus"></i>
                 </div>
                </div>
                <div class="btn-rapper">
                    <button class="reset-btn">reset</button>

                </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
